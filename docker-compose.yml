services:
  manguifi:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "file:/app/data/manguifi.db"
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: ${APP_URL}
    volumes:
      # Persists the SQLite database and the automated backups across
      # redeploys — without this, `docker compose up --build` wipes the DB.
      - manguifi-data:/app/data
      - manguifi-backups:/app/backups

volumes:
  manguifi-data:
  manguifi-backups:
