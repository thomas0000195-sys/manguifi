services:
  manguifi:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Postgres (Neon or equivalent) since the pilot deployment — see
      # SESSION_REPORT.md. No longer a local SQLite file, so nothing to
      # volume-mount for the database itself.
      DATABASE_URL: ${DATABASE_URL}
      AUTH_SECRET: ${AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM}
      APP_URL: ${APP_URL}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID}
      SENTRY_DSN: ${SENTRY_DSN}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      # The database itself now lives in Postgres (Neon), not on this
      # volume — this only persists the local backup JSON files across
      # redeploys. See the known limitation about /api/cron/backup not
      # working as-is on serverless hosts (SESSION_REPORT.md) — on a VPS
      # running this Dockerfile, local disk is fine.
      - manguifi-backups:/app/backups

volumes:
  manguifi-backups:
