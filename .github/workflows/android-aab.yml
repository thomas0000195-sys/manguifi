# Compilation du fichier .aab Android (TWA). Déclenchement manuel uniquement.
# ATTENTION : workflow NON TESTÉ. La première exécution peut demander des ajustements.
name: Android AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/android-twa
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Accepte les licences du SDK Android (conditions Google, acceptées par le propriétaire du dépôt).
      - name: Accepter les licences Android
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Restaurer la clé d'envoi (hors dépôt)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p keys
          echo "$KEYSTORE_B64" | base64 -d > keys/upload.jks

      - name: Générer le projet Android (première fois)
        run: |
          if [ ! -d android ]; then
            yes "" | bubblewrap init --manifest=https://www.manguifi.tech/manifest.webmanifest --directory=.
          fi

      - name: Compiler le .aab
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publier le .aab
        uses: actions/upload-artifact@v4
        with:
          name: manguifi-aab
          path: mobile/android-twa/app-release-bundle.aab
          retention-days: 14

      - name: Supprimer la clé du runner
        if: always()
        run: rm -f keys/upload.jks
