# Compilation iOS et envoi vers TestFlight. Déclenchement manuel uniquement.
# ATTENTION : workflow NON TESTÉ. Nécessite le projet Xcode généré (npx cap add ios) et les secrets.
name: iOS TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: mobile/ios-capacitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Installer les dépendances natives
        run: npm install

      - name: Générer le projet iOS (première fois)
        run: |
          if [ ! -d ios ]; then npx cap add ios; fi
          npx cap sync ios

      - name: Installer fastlane
        run: gem install fastlane -N

      - name: Envoyer vers TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane testflight
